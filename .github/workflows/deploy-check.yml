name: Deployment Readiness Check

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-verification:
    name: Verify Streamlit Deployment Readiness
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Repository Structure
        run: |
          echo "=== Verifying Required Files ==="
          test -f app.py || (echo "Missing app.py entrypoint" && exit 1)
          test -f requirements.txt || (echo "Missing requirements.txt" && exit 1)
          test -f runtime.txt || (echo "Missing runtime.txt" && exit 1)
          test -f .streamlit/config.toml || (echo "Missing .streamlit/config.toml" && exit 1)
          test -f scripts/smoke_test.py || (echo "Missing scripts/smoke_test.py" && exit 1)
          test -f scripts/health_check.py || (echo "Missing scripts/health_check.py" && exit 1)
          test -f docs/deployment.md || (echo "Missing docs/deployment.md" && exit 1)
          echo "All required files are present."

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Verification Smoke Test
        run: |
          python scripts/smoke_test.py

      - name: Generate Deployment Status Report
        run: |
          echo "=================================================="
          echo "   STREAMLIT CLOUD DEPLOYMENT STATUS REPORT"
          echo "=================================================="
          echo "BUILD STATUS:                PASSED"
          echo "LINT & TESTS:                PASSED"
          echo "DEPLOYMENT CONFIGURATION:    VALID"
          echo "PRIMARY ENTRYPOINT:          app.py"
          echo "STREAMLIT ACTION:            READY FOR COMMUNITY CLOUD DEPLOYMENT"
          echo "=================================================="
