name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify Ruff Code Style
        run: |
          python -m ruff check .

      - name: Verify Ruff Formatting
        run: |
          python -m ruff format --check .

      - name: Run Test Suite (Pytest)
        run: |
          python -m pytest -v

      - name: Run Streamlit & Database Engine Smoke Test
        run: |
          python scripts/smoke_test.py
