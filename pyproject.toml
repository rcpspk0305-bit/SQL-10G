[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "oracli"
version = "1.0.0"
description = "Oracle 10g SQL*Plus-Compatible Educational Database Environment"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Charan Rajanala" }
]
dependencies = [
    "sqlglot>=25.0.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.35.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
oracli = "app.cli.terminal:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = []
